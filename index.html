<title>SACCADES</title>
<style>

:root[data-theme="dark"]{--bg:#0f1720;--surface:#18232f;--ink:#e6edf3;--sub:#9aa9b8;--line:#2a3a4a;--accent:#5aa2ff;--on-accent:#0b1522;--dot:#27415f;--miss:#6b2e33;--warn:#ff8a80;--cs:50%;--cl:34%;--tl:74%;color-scheme:dark}

:root[data-bg="dgray"]{--bg:#2a2e35;--surface:#343942;--ink:#e8edf2;--sub:#a3adb8;--line:#4a515c;--accent:#5aa2ff;--on-accent:#0b1522;--dot:#3f5a7d;--miss:#7a3037;--warn:#ff8a80;--cs:50%;--cl:36%;--tl:76%;color-scheme:dark}
:root[data-bg="black"]{--bg:#000;--surface:#0c0c0c;--ink:#eef2f6;--sub:#9aa5b1;--line:#2a2a2a;--accent:#5aa2ff;--on-accent:#0b1522;--dot:#1f3552;--miss:#6b2e33;--warn:#ff8a80;--cs:50%;--cl:32%;--tl:76%;color-scheme:dark}

:root[data-bg="marble"] .top,:root[data-bg="marble"] .sum,:root[data-bg="marble"] .stat,:root[data-bg="marble"] .result,:root[data-bg="marble"] .pn{background:rgba(255,255,255,.84);border-radius:12px;padding:6px 12px}
:root[data-bg="marble"] .idle{background:rgba(255,255,255,.85);color:var(--ink)}
:root[data-bg="marble"] #board button.col{background:hsl(var(--h) 80% 55% / .38)}
:root[data-bg="marble"] body{background:var(--marble,none) center/cover fixed no-repeat,linear-gradient(135deg,#eceef1,#cdd2d8)}
input[type=range]{width:150px;accent-color:var(--accent)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
main{max-width:480px;margin:0 auto;padding:16px}
@media (min-width:700px){main{max-width:660px}}
h1{font-size:20px;margin:4px 0 12px}
.lbl{font-size:12px;color:var(--sub);margin:0 0 4px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg button{flex:1 1 52px;min-width:0;line-height:1.2;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-size:13px;padding:0 2px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.desc{font-size:13px;color:var(--sub);margin:0 0 6px;line-height:1.5;min-height:3em}
.stat{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.time{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.time.low{color:var(--warn)}
.target{font-size:15px;color:var(--sub);text-align:right}
.target b{font-size:26px;color:var(--ink)}
#board{position:relative;width:100%;width:min(100%,max(300px,calc(100dvh - 260px)));margin:0 auto;aspect-ratio:1;background:var(--field,var(--surface));border:1px solid var(--line);border-radius:14px;overflow:hidden}
#board button{position:absolute;border:0;background:var(--dot);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
#board button.col{background:hsl(var(--h) var(--cs) var(--cl))}
#board button.num,#board button.num.col{background:transparent;font-weight:700}
#board button.num.col{color:hsl(var(--h) 80% var(--tl))}
#board button.done{background:transparent;color:var(--sub);opacity:.4}
#board button.num.done{color:var(--sub)}
#board button.miss,#board button.num.miss{background:var(--miss)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.top h1{margin:4px 0}
.setbtn{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-size:14px;font-family:inherit}
.sum{font-size:12px;color:var(--sub);margin:0 0 10px;line-height:1.5}
main.play .top,main.play .sum{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;opacity:0;pointer-events:none;transition:opacity .2s}
.side{position:fixed;top:0;bottom:0;left:0;width:min(380px,90vw);background:var(--bg);color:var(--ink);border-right:1px solid var(--line);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-102%);visibility:hidden;transition:transform .22s,visibility .22s}
.set-open .side{transform:none;visibility:visible}
.set-open .scrim{opacity:1;pointer-events:auto}
.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sidehead h2{font-size:18px;margin:0}
.sidehead button{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-size:16px}
.side .lbl{margin-top:6px}
.side .desc{min-height:0;margin:0 0 10px}
.side label.opt{display:flex;margin:10px 0 0}
.side input[type=range]{flex:1;width:auto}
#board{container-type:inline-size}
main.play.fs{max-width:1920px;padding:10px}
main.play.fs h1,main.play.fs .opt,main.play.fs .result{display:none}
main.play.fs #board{width:100%;aspect-ratio:auto;height:calc(100vh - 175px);height:calc(100dvh - 175px)}
.pn{display:flex;align-items:center;gap:10px;margin-bottom:8px}.pn[hidden]{display:none}.pbar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;width:100%;background:var(--accent)}.pbar i.low{background:var(--warn)}#pt{font-size:13px;color:var(--sub);min-width:4.5em;text-align:right;font-variant-numeric:tabular-nums}
.idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:15px;line-height:1.7;padding:24px}
.go{display:block;width:100%;min-height:52px;margin-top:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:700}
label.opt{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--sub);margin:12px 16px 0 0}
.result{margin-top:12px;font-size:15px;line-height:1.7;min-height:3.4em;white-space:pre-line}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main id="app">
  <div class="top"><h1>SACCADES</h1><button class="setbtn" id="openset" aria-expanded="false" aria-controls="side">☰ 設定</button></div>
  <p class="sum" id="sum"></p>
  <div class="stat">
    <div class="time" id="time">0.00</div>
    <div class="target" id="info"></div>
  </div>
  <div class="pn" id="pn" hidden><div class="pbar"><i id="pfill"></i></div><span id="pt"></span></div>
  <div id="board"></div>
  <button class="go" id="go">スタート</button>
  <div class="result" id="result" aria-live="polite"></div>
</main>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="設定" aria-hidden="true">
  <div class="sidehead"><h2>設定</h2><button id="closeset" aria-label="設定を閉じる">✕</button></div>
    <p class="lbl">個数</p><div class="seg" id="counts" role="group" aria-label="数字の個数"></div>
    <p class="lbl">配置の形</p><div class="seg" id="shapes" role="group" aria-label="配置の形"></div>
    <p class="lbl">難易度</p><div class="seg" id="diffs" role="group" aria-label="難易度"></div>
    <p class="desc" id="desc"></p>
    <p class="lbl">1つごとの制限時間の難易度（<span id="pdesc"></span>）</p><div class="seg" id="pdiffs" role="group" aria-label="1つごとの制限時間の難易度"></div>
    <p class="lbl">許されるミスの回数</p><div class="seg" id="misses" role="group" aria-label="許されるミスの回数"></div>
    <p class="lbl">背景色</p><div class="seg" id="bgs" role="group" aria-label="背景色"></div>
    <p class="lbl">オプション</p>
  <label class="opt"><input type="checkbox" id="limit"> <span id="limitTxt">制限時間</span></label>
  <label class="opt"><input type="checkbox" id="plimit"> <span id="plimitTxt">1つごとの制限時間</span></label>
  <label class="opt"><input type="checkbox" id="color"> ランダムな色</label>
  <label class="opt"><input type="checkbox" id="hint"> 次の数字を表示</label>
  <label class="opt"><input type="checkbox" id="snd" checked> 効果音</label>
  <label class="opt">音量 <input type="range" id="vol" min="0" max="100" step="1" value="50" aria-label="効果音の音量"> <span id="volv">50</span></label>
  <label class="opt"><input type="checkbox" id="fs"> フル画面でプレイ</label>
</aside>

  for(c=1;c<=N;c++){r=Math.ceil(N/c);sz=Math.min(W/c,H/r);if(!best||sz>best.sz)best={c:c,r:r,sz:sz}}
  var cw=W/best.c,ch=H/best.r,gap=Math.max(2,Math.min(cw,ch)*.07),p=[],i;
  for(i=0;i<N;i++)p.push({x:(i%best.c+.5)*cw,y:(Math.floor(i/best.c)+.5)*ch,w:cw-gap,h:ch-gap,g:1});
  return p;
}
function scatter(W,H,v,m){
  var base=Math.sqrt(.42*W*H/(N*Math.PI))*m,s=1,lo=1-.4*v,hi=1+.5*v,gap=Math.min(W,H)*.008;
  for(var t=0;t<60;t++){
    var rs=[],i;for(i=0;i<N;i++)rs.push(base*s*(lo+Math.random()*(hi-lo)));
    rs.sort(function(a,b){return b-a});
    var pts=[],ok=true;
    for(i=0;i<N&&ok;i++){var r=rs[i],placed=false;
      for(var a=0;a<80&&!placed;a++){
        var x=r+Math.random()*(W-2*r),y=r+Math.random()*(H-2*r),clear=true;
        for(var k=0;k<pts.length;k++){var dx=x-pts[k].x,dy=y-pts[k].y,mm=r+pts[k].w/2+gap;if(dx*dx+dy*dy<mm*mm){clear=false;break}}
        if(clear){pts.push({x:x,y:y,w:2*r,h:2*r});placed=true}
      }
      if(!placed)ok=false;
    }
    if(ok)return pts;s*=.95;
  }
  return gridPts(W,H);
}
function render(){
  var d=DIFFS[di],grid=si===0,W=board.clientWidth||300,H=board.clientHeight||300,pts=grid?gridPts(W,H):scatter(W,H,d.v,MULT[si]),nums=[],i,useColor=colorEl.checked;
  rW=W;rH=H;
  for(i=1;i<=N;i++)nums.push(i);shuffle(nums);
  board.innerHTML='';
  pts.forEach(function(p,k){
    var v=nums[k],b=document.createElement('button'),fs=p.g?.55*Math.min(p.w,p.h):p.w/2*FONT[si],css;
    css='left:'+(p.x-p.w/2)/W*100+'%;top:'+(p.y-p.h/2)/H*100+'%;width:'+p.w/W*100+'%;height:'+p.h/H*100+'%;font-size:'+Math.max(10,fs)+'px;font-size:max(10px,'+(fs/W*100).toFixed(2)+'cqw);';
    if(p.g)css+='border-radius:10px;';else if(si===1||si===4)css+='border-radius:50%;';
    else if(si===2)css+='clip-path:'+PENT+';';else css+='clip-path:'+DIAM+';';
    b.style.cssText=css;b.textContent=v;
    if(si===4)b.classList.add('num');
    if(useColor){b.classList.add('col');b.style.setProperty('--h',Math.floor(Math.random()*360))}
    if(done[v]&&d.dim)b.classList.add('done');
    b.addEventListener('pointerdown',function(e){e.preventDefault();audio();tap(b,v)});
    board.appendChild(b);
  });
}
function info(){infoEl.innerHTML=running||miss?'ミス '+miss+missCap()+(hint.checked&&running?'<br>次は <b>'+next+'</b>':''):''}
function idle(){
  app.classList.remove('play');running=false;miss=0;limit=limitEl.checked?limitSec():0;pn.hidden=true;
  board.innerHTML='<div class="idle">'+N+'個の数字を、1から順にタップします。<br>'+missRule()+(limit?'<br>制限時間 '+fmtS(limit):'')+(plimitEl.checked?'<br>1つごとに'+PL[pdi]+'秒':'')+'</div>';
  timeEl.className='time';timeEl.textContent=limit?fmtT(limit):'0.00';info();$('sum').textContent=sumText();
  var b=best();resEl.textContent=b?'この設定のベスト：'+b.toFixed(2)+'秒':'画面の中心を見つめたまま、視線を大きく動かして探しましょう。';
  goBtn.textContent='スタート';
}
function start(){
  setSide(false);done={};next=1;miss=0;running=true;limit=limitEl.checked?limitSec():0;app.classList.add('play');render();info();resEl.textContent='';goBtn.textContent='やめる';
  t0=performance.now();nt0=t0;plim=plimitEl.checked?PL[pdi]:0;pn.hidden=!plim;pfill.style.width='100%';pfill.className='';clearInterval(timer);
  timer=setInterval(function(){
    var el=(performance.now()-t0)/1000;
    if(limit){var rem=limit-el;if(rem<=0){timeEl.textContent=fmtT(0);fail('時間切れです。');return}timeEl.textContent=fmtT(rem);timeEl.classList.toggle('low',rem<10)}
    else timeEl.textContent=el.toFixed(2);
    if(plim){var pr=plim-(performance.now()-nt0)/1000;if(pr<=0){pt.textContent='0.0秒';pfill.style.width='0%';plTimeout();return}pt.textContent=pr.toFixed(1)+'秒';pfill.style.width=(pr/plim*100)+'%';pfill.className=pr<3?'low':''}
  },50);
}
function enterFs(){
  if(!fsEl.checked)return false;
  var e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;
  if(f&&!document.fullscreenElement&&!document.webkitFullscreenElement){try{var r=f.call(e);if(r&&r.catch)r.catch(function(){});return true}catch(x){}}
  return false;
}
function exitFs(){
  var f=document.exitFullscreen||document.webkitExitFullscreen;
  if((document.fullscreenElement||document.webkitFullscreenElement)&&f){try{var r=f.call(document);if(r&&r.catch)r.catch(function(){})}catch(x){}}
}
function plTimeout(){
  if(!running)return;
  miss++;beep(0);info();nt0=performance.now();
  if(miss>MISSOPT[mi].m){fail(missEnd());return}
  if(DIFFS[di].re)render();
}
function stop(){running=false;clearInterval(timer);app.classList.remove('play');pn.hidden=true}
function tap(b,v){
  if(!running)return;
  var d=DIFFS[di];
  if(done[v]&&d.dim)return;
  if(v===next){
    done[v]=1;next++;nt0=performance.now();beep(1);info();
    if(next>N){finish();return}
    if(d.re)render();else b.classList.add('done');
  }else{
    miss++;beep(0);info();
    if(miss>MISSOPT[mi].m){fail(missEnd());return}
    if(d.re)render();else{b.classList.add('miss');setTimeout(function(){b.classList.remove('miss')},180)}
  }
}
function finish(){
  stop();var sec=(performance.now()-t0)/1000;
  timeEl.textContent=limit?fmtT(Math.max(0,limit-sec)):sec.toFixed(2);
  var prev=best(),msg='クリア！ '+sec.toFixed(2)+'秒（ミス '+miss+'回）';
  if(prev===null||sec<prev){save(key(),sec);msg+='\nベスト更新！'}else msg+='\nベスト：'+prev.toFixed(2)+'秒';
  resEl.textContent=msg;goBtn.textContent='もう一度';info();
}
function fail(reason){
  stop();resEl.textContent=reason+'\n'+(next-1)+'個目まで見つけました。';goBtn.textContent='もう一度';info();
}
function audio(){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;ac=new C();comp=ac.createGain();var dc=ac.createDynamicsCompressor();comp.connect(dc);dc.connect(ac.destination);setVol()}if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(ok){
  if(!snd.checked||!ac)return;
  try{var t=ac.currentTime;
    if(ok){
      var o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();
      o.setPeriodicWave(ac.createPeriodicWave(new Float32Array(5),new Float32Array([0,1,.5,.25,.1])));o.frequency.setValueAtTime(1175,t);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.6,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);
      lp.type='lowpass';lp.frequency.setValueAtTime(7000,t);lp.frequency.exponentialRampToValueAtTime(1500,t+1.1);
      o.connect(g);g.connect(lp);lp.connect(comp);o.start(t);o.stop(t+1.2);
    }else{
      sink(t,'triangle',120,32,1.3,1.4,.6,[2200,350]);sink(t,'sawtooth',120,32,1.3,1.4,.2,[1500,260]);sink(t,'sine',60,26,1.4,1.4,.6,null);
    }
  }catch(e){}
}
function sink(t,type,f0,f1,gl,dur,vol,lpv){
  var o=ac.createOscillator(),g=ac.createGain(),n;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+gl);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);n=g;
  if(lpv){var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(lpv[0],t);lp.frequency.exponentialRampToValueAtTime(lpv[1],t+dur);n.connect(lp);n=lp}
  n.connect(comp);o.start(t);o.stop(t+dur+.1);
}
goBtn.onclick=function(){audio();if(running){stop();idle()}else if(!pending){if(enterFs()){pending=true;setTimeout(function(){pending=false;if(!running)start()},350)}else start()}};
hint.onchange=function(){save('nh-hint',hint.checked?'1':'0');info()};
snd.onchange=function(){save('nh-snd',snd.checked?'1':'0');audio()};
colorEl.onchange=function(){save('nh-color',colorEl.checked?'1':'0')};
limitEl.onchange=function(){save('nh-limit',limitEl.checked?'1':'0');if(!running)idle()};
plimitEl.onchange=function(){save('nh-plimit',plimitEl.checked?'1':'0');if(!running)idle()};
fsEl.onchange=function(){save('nh-fs',fsEl.checked?'1':'0');app.classList.toggle('fs',fsEl.checked);if(!fsEl.checked)exitFs();if(!running){drawMenus();idle()}};
var rz=null;function onSize(){clearTimeout(rz);rz=setTimeout(function(){if(running){if(Math.abs(board.clientWidth-rW)>4||Math.abs(board.clientHeight-rH)>4)render()}else{drawMenus();idle()}},250)}
window.addEventListener('resize',onSize);document.addEventListener('fullscreenchange',onSize);document.addEventListener('webkitfullscreenchange',onSize);
volEl.oninput=function(){volv.textContent=volEl.value;setVol()};
volEl.onchange=function(){save('nh-vol',volEl.value);audio();setVol();beep(1)};
function sumText(){var m=MISSOPT[mi].m;return N+'個・'+SHAPES[si]+'・'+DIFFS[di].name+(limitEl.checked?'・全体'+fmtS(limitSec()):'')+(plimitEl.checked?'・1つごと'+PL[pdi]+'秒':'')+'・'+(m===Infinity?'ミス制限なし':m===0?'ミス即停止':'ミス'+m+'回まで')}
var sideEl=$('side'),openBtn=$('openset');
function setSide(o){document.body.classList.toggle('set-open',o);sideEl.setAttribute('aria-hidden',o?'false':'true');openBtn.setAttribute('aria-expanded',o?'true':'false');if(o)$('closeset').focus()}
openBtn.onclick=function(){setSide(true)};
$('closeset').onclick=function(){setSide(false);openBtn.focus()};
$('scrim').onclick=function(){setSide(false)};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('set-open'))setSide(false)});
applyBg();
drawMenus();idle();
})();
</script>

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
